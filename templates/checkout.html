{% extends "base.html" %}

{% block title %}Checkout{% endblock %}

{% block content %}

<section class="checkout">

<div class="checkout-form">

<h2>Checkout</h2>

<form action="/place-order" method="POST">

<input
type="text"
name="name"
placeholder="Full Name"
required>

<input
type="tel"
name="phone"
placeholder="Phone Number"
required>

<input
type="email"
name="email"
placeholder="Email Address"
required>

<textarea
name="address"
placeholder="Delivery Address"
required></textarea>

<input
type="hidden"
name="cart"
id="cartData">

<button type="submit">
Place Order
</button>

</form>

</div>

<div class="order-summary">

<h2>Order Summary</h2>

<div id="summaryItems"></div>

<hr>

<p>
Subtotal
<span id="subtotal">₦0</span>
</p>

<p>
Delivery
<span>₦5,000</span>
</p>

<h3>
Total
<span id="grandTotal">₦0</span>
</h3>

</div>

</section>

{% endblock %}
