{% extends "base.html" %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}

<section class="product-details">

<div class="product-image">
    <img src="{{ url_for('static', filename=product.image) }}" alt="{{ product.name }}">
</div>

<div class="product-info">

    <h1>{{ product.name }}</h1>

    <h2>₦{{ "{:,}".format(product.price) }}</h2>

    <p>
        Premium quality fashion designed for style,
        comfort and confidence.
    </p>

    <label>Size</label>

    <select id="size">
        <option>S</option>
        <option>M</option>
        <option>L</option>
        <option>XL</option>
    </select>
    
    <label>Quantity</label>

        <input
        type="number"
        id="qty"
        value="1"
        min="1">
    
    <button onclick="addToCart(
        {{ product.id }},
        '{{ product.name }}',
        {{ product.price }},
        '{{ product.image }}'
    )">
        Add to Cart
    </button>

</div>

</section>

{% endblock %}
